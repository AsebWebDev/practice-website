version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait two weeks, so a compromised version is likely to be
    # caught before it is proposed here.
    cooldown:
      default-days: 14
    groups:
      # One pull request per week instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Node types must match the Node version in .nvmrc, so their major
      # version changes together with that file.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
